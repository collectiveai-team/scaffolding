# MARK: uv-lock
[[repos]]
repo = "https://github.com/astral-sh/uv-pre-commit"
rev = "0.10.7"
hooks = [{ id = "uv-lock", priority = 0 }]

# MARK: pre-commit-hooks
[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"

# MARK: check-merge-conflict
[[repos.hooks]]
id = "check-merge-conflict"
priority = 0

# MARK: check-added-large-files
[[repos.hooks]]
id = "check-added-large-files"
args = ["--maxkb=750"]
exclude = "^uv\\.lock$"
priority = 0

# MARK: check-toml
[[repos.hooks]]
id = "check-toml"
priority = 0

# MARK: check-yaml
[[repos.hooks]]
id = "check-yaml"
args = ["--unsafe"]
priority = 0

# MARK: end-of-file-fixer
[[repos.hooks]]
id = "end-of-file-fixer"
priority = 0

# MARK: trailing-whitespace
[[repos.hooks]]
id = "trailing-whitespace"
priority = 0

# MARK: betterleaks
# Secret scanner (gitleaks fork). language = "golang" so prek builds it from the
# pinned tag in an isolated toolchain. Scans staged changes on commit; --redact
# keeps any matched secret out of the output.
[[repos]]
repo = "https://github.com/betterleaks/betterleaks"
rev = "v1.5.0"
hooks = [{ id = "betterleaks", priority = 0 }]

# MARK: agents-conventional-commits
# CES-75: the commit subject must follow Conventional Commits (type(scope): description).
# Runs at the commit-msg stage on the message file; merge/revert/fixup subjects are exempt.
[[repos]]
repo = "local"

[[repos.hooks]]
id = "agents-conventional-commits"
name = "agents-conventional-commits (commit-msg)"
entry = "python -c \"import re,sys; msg=open(sys.argv[1],encoding='utf-8').readline().strip(); ok=bool(re.match(r'^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\\([a-z0-9._-]+\\))?!?: .+', msg)) or msg.startswith(('Merge ','Revert ','fixup! ')); sys.exit(0 if ok else not print(f'Error: CES-75 (agents-conventional-commits): commit subject must follow Conventional Commits (type(scope): description). Got: {msg!r}'))\""
language = "system"
stages = ["commit-msg"]

# MARK: no-ai-coauthorship
# CES-91: commit metadata stays human-accountable — no AI co-authorship/attribution trailers
# (`Co-authored-by: Claude <...>`, `Generated with Claude Code`, etc). Local feedback only; a
# local hook can be bypassed with `--no-verify`, so CI (commit-policy.yml) is the source of truth.
[[repos.hooks]]
id = "no-ai-coauthorship"
name = "no-ai-coauthorship (commit-msg)"
entry = "python -c \"import re,sys; msg=open(sys.argv[1],encoding='utf-8').read(); tools='claude|anthropic|copilot|github copilot|chatgpt|openai|codex|cursor|windsurf|aider|gemini|devin|opencode'; pat=re.compile(r'(?im)^\\s*(co-authored-by:.*(' + tools + r')|generated[\\s-]+(with|by):?.*(' + tools + r')|ai-generated-by:?.*(' + tools + r')|assisted-by:?.*(' + tools + r'))'); m=pat.search(msg); sys.exit(0 if not m else not print(f'Error: CES-91 (no-ai-coauthorship): commit message must not carry AI co-authorship/attribution trailers. Found: {m.group(0)!r}'))\""
language = "system"
stages = ["commit-msg"]

# MARK: jscpd
# CES-118: copy-pasted (near-verbatim) code blocks above a token threshold, complementary to
# ast-grep (single declared pattern) — catches the "agent copies the nearest block instead of
# extracting a shared helper" failure mode. Polyglot (tree-sitter, 223+ formats), so it lives
# here rather than the Python-only hooks. Respects .gitignore by default. `--threshold` alone is
# the gate (fails only over the percentage); jscpd v5's separate `--exit-code` flag fails on ANY
# clone found regardless of threshold — do not combine the two or the threshold becomes inert.
#
# --ignore covers generated lockfiles. .gitignore is not enough for these: a lockfile is
# *tracked*, so jscpd reads it, and it is large and highly repetitive — a 16k-line
# pnpm-lock.yaml can outweigh the entire first-party source and make the percentage a
# measure of the lockfile rather than of the code the hook exists to police.
#
# CALIBRATE --threshold BEFORE ENABLING THIS. 1 is a floor for a greenfield repo, not a
# universal default: measure the repo first (`npx --yes jscpd@5 .`) and set the threshold
# just above the number you get, as a ratchet to tighten later. jscpd gates on the
# *duplicated lines* percentage, not tokens. This repo's own hook is a worked example —
# `--threshold 2.5` with its own `--ignore` list, calibrated to a ~1.9% baseline. Shipping
# an uncalibrated 1 to an existing codebase fails the hook on the first commit, and the
# only fixes then are a real refactor or a threshold nobody chose deliberately.
[[repos.hooks]]
id = "jscpd"
name = "jscpd (copy-paste duplication)"
entry = "npx --yes jscpd@5 . --threshold 1 --ignore \"**/uv.lock,**/poetry.lock,**/Pipfile.lock,**/package-lock.json,**/pnpm-lock.yaml,**/yarn.lock,**/bun.lock,**/bun.lockb,**/Cargo.lock,**/go.sum,**/composer.lock,**/Gemfile.lock\""
language = "system"
pass_filenames = false
priority = 2

# MARK: hadolint-docker
# CES-114: lint Dockerfile source (unpinned base images, missing --no-install-recommends, ADD
# vs COPY misuse, running as root, etc). File-pattern-scoped, so it is inert unless a Dockerfile
# is present — safe to ship unconditionally, same posture as repo-shape's placeholder scoping.
[[repos]]
repo = "https://github.com/hadolint/hadolint"
rev = "v2.15.1"
hooks = [{ id = "hadolint-docker", files = "^Dockerfile", priority = 2 }]
