# MARK: validate-pyproject
[[repos]]
repo = "https://github.com/abravalheri/validate-pyproject"
rev = "v0.25"
hooks = [
  { id = "validate-pyproject", files = "^pyproject\\.toml$", priority = 0 }
]

# MARK: ruff-format
[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.15.22"

[[repos.hooks]]
id = "ruff-format"
priority = 0

# MARK: ruff-check
[[repos.hooks]]
id = "ruff-check"
args = ["--fix", "--exit-non-zero-on-fix"]
types_or = ["python", "pyi"]
require_serial = true
priority = 1

# MARK: pyrefly
[[repos]]
repo = "local"

[[repos.hooks]]
id = "pyrefly"
name = "pyrefly"
entry = "uvx pyrefly check --config pyproject.toml"
language = "system"
types = ["python"]
pass_filenames = false
priority = 2

# MARK: ast-grep
[[repos.hooks]]
id = "ast-grep"
name = "ast-grep"
entry = "uvx --from ast-grep-cli ast-grep scan"
language = "system"
types = ["python"]
pass_filenames = false
priority = 2

# MARK: file-size-guard
[[repos.hooks]]
id = "file-size-guard"
name = "file-size-guard (400 large / 700 enormous)"
entry = "python -c \"import sys; sys.exit(max([0] + [1 for f in sys.argv[1:] for n in [sum(1 for _ in open(f, errors='ignore'))] if (n >= 700 and not print(f'Error: CES-71 (file-size-guard): {f} is too large ({n} lines, limit is 700)')) or (n >= 400 and not print(f'Warning: CES-71 (file-size-guard): {f} is large ({n} lines, recommended limit is 400)') and False)]))\""
language = "system"
types = ["python"]
priority = 2

# MARK: deptry
# CES-109: declared `pyproject.toml` dependencies must match the actual import graph — no
# declared-but-unused deps, no imported-but-undeclared deps, no dev-vs-prod misplacement. Add
# a `[tool.deptry]` config with `extend_exclude` if the repo has separate-distribution
# subpackages or bundled/vendored payload (see this tool's own pyproject.toml for an example).
[[repos.hooks]]
id = "deptry"
name = "deptry (unused/missing/misplaced dependencies)"
entry = "uvx deptry ."
language = "system"
types = ["python"]
pass_filenames = false
priority = 2

# MARK: complexipy
# CES-110: cognitive-complexity ceiling per function — complements (not replaces) ruff's
# cyclomatic `C90`/mccabe check by penalizing nesting depth and control-flow breaks, the metric
# that tracks how hard a human actually finds a function to read.
[[repos.hooks]]
id = "complexipy"
name = "complexipy (cognitive complexity)"
entry = "uvx complexipy --max-complexity-allowed 15"
language = "system"
types = ["python"]
priority = 2

# MARK: no-utils
# CES-63: catch-all module names (utils/helpers/aux/misc/common) hide grab-bags of unrelated
# code. The hook only ever runs on files whose basename matches, so it always fails when invoked.
[[repos.hooks]]
id = "no-utils"
name = "no-utils (no catch-all modules)"
entry = "python -c \"import sys; [print(f'Error: CES-63 (no-utils): {f} is a catch-all module — name modules for what they hold, not utils/helpers/aux/misc/common.') for f in sys.argv[1:]]; sys.exit(1 if sys.argv[1:] else 0)\""
language = "system"
files = "(^|/)(utils|helpers|aux|misc|common)\\.py$"
exclude = "(^|/)tests/"
priority = 2

# MARK: repo-shape
# CES-32: notebooks, resources/, reports/, and data/ do not belong inside the import package.
# {{ import_package }} is a copier-style placeholder — resolve it to your top-level package dir
# at install time (the guide instructs the fill); until then this hook never matches.
[[repos.hooks]]
id = "repo-shape"
name = "repo-shape (no notebooks/resources/reports/data in the package)"
entry = "python -c \"import sys; [print(f'Error: CES-32 (repo-shape): {f} does not belong inside the import package — keep notebooks/resources/reports/data outside it.') for f in sys.argv[1:]]; sys.exit(1 if sys.argv[1:] else 0)\""
language = "system"
files = "^{{ import_package }}/(.*\\.ipynb$|(.*/)?(resources|reports|data)/.*)"
priority = 2
