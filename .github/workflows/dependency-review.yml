name: dependency-review

# CES-113 (dependency-review-action): diff the dependency graph between a PR's base and head ref
# and surface newly-introduced dependencies, licenses, and vulnerability severity directly on the
# PR — closes the "dependency creep" blind spot pip-audit/osv-scanner don't cover (they scan the
# final resolved set, never what changed in *this* PR). Summary-only (no fail-on-severity /
# deny-licenses) so it can't block merges during burn-in; promote to a hard gate later as a
# separate decision.
#
# Requires the repo's (or org's) "Dependency graph" enabled. Unlike most GitHub security
# features, the action does NOT no-op quietly when it's unavailable — it hard-fails the step
# ("Dependency review is not supported on this repository"). Since the whole point of this check
# is "can't block merges", continue-on-error keeps that promise even when the org/repo hasn't
# (or can't) enable Dependency graph — flip continue-on-error off only once you've confirmed the
# feature is actually enabled (Settings > Security > Dependency graph, or the org-level policy).

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@v5.0.0
        continue-on-error: true
        with:
          comment-summary-in-pr: always
